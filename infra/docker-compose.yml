# Infraestructura de desarrollo. Ejecutar SIEMPRE desde la raíz del repositorio:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# (--env-file es necesario porque el .env vive en la raíz, no junto a este archivo).
#
# El cliente móvil (Flutter) todavía no forma parte de este compose. El servicio "nginx"
# compila y sirve la SPA de React, y hace de proxy inverso de /api, /graphql y /ws.

name: diagramas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-diagramas}
      POSTGRES_USER: ${DB_USER:-diagramas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio, defínelo en el .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Puertos del host desplazados para no chocar con otros PostgreSQL/Redis de la máquina.
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diagramas} -d ${DB_NAME:-diagramas}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-diagramas}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?RABBIT_PASSWORD es obligatorio, defínelo en el .env}
    volumes:
      # Habilita el plugin STOMP (puerto 61613) que usa el broker relay del backend.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:61613:61613"  # STOMP
      - "127.0.0.1:15672:15672"  # consola de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ai-service:
    build:
      context: ../ai-service
    env_file: ../.env
    # NO se publica ningún puerto: solo es accesible desde la red interna de Docker.
    expose:
      - "8000"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    env_file: ../.env
    environment:
      # Dentro de Docker los hosts son los nombres de servicio, no localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-diagramas}
      REDIS_HOST: redis
      REDIS_PORT: "6379"   # dentro de la red de Docker es el puerto estándar
      RABBIT_HOST: rabbitmq
      AI_SERVICE_URL: http://ai-service:8000
      COLLAB_DISTRIBUTED: "true"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      STORAGE_LOCAL_DIR: /app/data/storage
    volumes:
      - backend-storage:/app/data/storage
      # Credenciales FCM: monta el archivo solo si FCM_CREDENTIALS_PATH apunta a /run/secrets/fcm.json
      # - ../secrets/fcm.json:/run/secrets/fcm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    # La imagen compila la SPA de React y la sirve; la configuración del proxy se monta aparte.
    build:
      context: ../web
      dockerfile: Dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve primero a ::1, y Nginx
      # solo escucha en IPv4, asi que la comprobacion fallaba siempre.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  backend-storage:
